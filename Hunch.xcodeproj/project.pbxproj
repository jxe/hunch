			shellScript = "if [ \"$PLATFORM_NAME\" != \"macosx\" ]; then\n    exit 0\nfi\nDEST=\"$HOME/Applications/Hunch.app\"\nmkdir -p \"$HOME/Applications\"\nrm -rf \"$DEST\"\ncp -R \"$BUILT_PRODUCTS_DIR/$PRODUCT_NAME.app\" \"$DEST\"\n# xcodebuild test injects HunchUnitTests.xctest into PlugIns/\n# for the test run; strip it so the install copy carries only\n# the app itself. Also keeps codesign from tripping on the\n# xctest's malformed bundle format mid-traversal.\nrm -rf \"$DEST/Contents/PlugIns\"\n# Sign bottom-up: nested dylibs first, then the bundle.\n# --deep is deprecated and bails on the first unreadable\n# subcomponent, which previously left Hunch.debug.dylib with\n# its old Apple Development signature while the main binary\n# got re-signed ad-hoc — dyld then rejected the launch with a\n# Team-ID mismatch.\nfor dylib in \"$DEST\"/Contents/MacOS/*.dylib; do\n    [ -e \"$dylib\" ] || continue\n    codesign --force --sign - \"$dylib\" >/dev/null 2>&1 \\\n        || echo \"warning: ad-hoc re-sign of $dylib failed\" >&2\ndone\ncodesign --force --sign - \"$DEST\" >/dev/null 2>&1 \\\n    || echo \"warning: ad-hoc re-sign of $DEST failed\" >&2\n";

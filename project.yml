name: Hunch
options:
  bundleIdPrefix: com.joeedelman
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: B7P78ULCXS
    CODE_SIGN_IDENTITY: Apple Development
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES

packages:
  Core:
    path: Packages/Core
  UI:
    path: Packages/UI

targets:
  Hunch:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: Core
      - package: UI
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Hunch
        CFBundleName: Hunch
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        LSSupportsOpeningDocumentsInPlace: YES
        UIFileSharingEnabled: YES
        NSHumanReadableCopyright: "© 2026 Joe Edelman"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joeedelman.console
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
  HunchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/UITests
    dependencies:
      - target: Hunch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joeedelman.console.uitests
        TEST_TARGET_NAME: Hunch
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Hunch:
    build:
      targets:
        Hunch: all
      # Drop a freshly-built copy at ~/Applications/Hunch.app after every macOS
      # build so a Dock entry there keeps working across rebuilds. Scheme
      # post-actions run *after* Xcode's full codesign, so we just copy — no
      # re-signing needed.
      postActions:
        - name: Install to ~/Applications (macOS only)
          settingsTarget: Hunch
          script: |
            if [ "$PLATFORM_NAME" != "macosx" ]; then
                exit 0
            fi
            # Kill any running copies (DerivedData OR ~/Applications) before
            # overwriting. Both copies share bundle ID com.joeedelman.console,
            # and macOS will happily run both simultaneously if they live at
            # different paths — leading to "two versions running" confusion.
            # Match by bundle id so we kill regardless of which path launched it.
            pkill -f "com.joeedelman.console" 2>/dev/null || true
            # Legacy executable name from the pre-rename builds.
            pkill -x Console 2>/dev/null || true
            pkill -x Hunch 2>/dev/null || true
            DEST="$HOME/Applications/Hunch.app"
            mkdir -p "$HOME/Applications"
            rm -rf "$DEST"
            cp -R "$BUILT_PRODUCTS_DIR/$PRODUCT_NAME.app" "$DEST"

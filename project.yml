name: Hunch
options:
  bundleIdPrefix: org.nxhx
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: B7P78ULCXS
    CODE_SIGN_IDENTITY: Apple Development
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES

packages:
  Editor:
    path: Packages/Editor
  swift-markdown:
    url: https://github.com/swiftlang/swift-markdown.git
    version: 0.8.0

targets:
  Hunch:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: Editor
      - package: swift-markdown
        product: Markdown
      - sdk: libsqlite3.tbd
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Hunch
        CFBundleName: Hunch
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSSupportsOpeningDocumentsInPlace: YES
        UIFileSharingEnabled: YES
        NSHumanReadableCopyright: "© 2026 Joe Edelman"
        NSMicrophoneUsageDescription: Hunch records audio so it can append a transcript to the current page.
        NSSpeechRecognitionUsageDescription: Hunch transcribes recorded audio so it can append the text to the current page.
        UIBackgroundModes: [audio]
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: org.nxhx.Hunch.appIcon
            UIApplicationShortcutItemTitle: Change Icon
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeCompose
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.nxhx.Hunch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Woman
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: App/Hunch.entitlements
        GENERATE_INFOPLIST_FILE: NO
        # Build phase below writes to ~/Applications, which is outside the
        # build sandbox. Disable script sandboxing for this target so the
        # install copy can run.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      # Drop a freshly-built copy at ~/Applications/Hunch.app after every macOS
      # build so a Dock entry / Spotlight launch / `open ~/Applications/Hunch.app`
      # keeps tracking the latest build. Lives as a build phase (not a scheme
      # postAction) so plain `xcodebuild build` from CLI also installs — scheme
      # postActions only fire on Xcode's Run action.
      #
      # Build phases run *before* Xcode's implicit final codesign step, so the
      # bundle in BUILT_PRODUCTS_DIR may not be signed yet when we copy. We
      # re-sign the destination ad-hoc ourselves while preserving the
      # app's sandbox entitlements: AppleSystemPolicy on macOS 14+ blocks
      # Apple Development-signed apps launched outside an Xcode debug
      # session (POSIX 163 spawn failure), but accepts ad-hoc signatures
      # for local builds. This makes `open ~/Applications/Hunch.app` work
      # without needing scripts/run.sh to re-sign at launch time.
      - name: Install to ~/Applications (macOS only)
        basedOnDependencyAnalysis: false
        script: |
          if [ "$PLATFORM_NAME" != "macosx" ]; then
              exit 0
          fi
          DEST="$HOME/Applications/Hunch.app"
          ENTITLEMENTS="$SRCROOT/App/Hunch.entitlements"
          mkdir -p "$HOME/Applications"
          rm -rf "$DEST"
          cp -R "$BUILT_PRODUCTS_DIR/$PRODUCT_NAME.app" "$DEST"
          # xcodebuild test injects HunchUnitTests.xctest into PlugIns/
          # for the test run; strip it so the install copy carries only
          # the app itself. Also keeps codesign from tripping on the
          # xctest's malformed bundle format mid-traversal.
          rm -rf "$DEST/Contents/PlugIns"
          # Sign bottom-up: nested dylibs first, then the bundle.
          # --deep is deprecated and bails on the first unreadable
          # subcomponent, which previously left Hunch.debug.dylib with
          # its old Apple Development signature while the main binary
          # got re-signed ad-hoc — dyld then rejected the launch with a
          # Team-ID mismatch.
          for dylib in "$DEST"/Contents/MacOS/*.dylib; do
              [ -e "$dylib" ] || continue
              codesign --force --sign - "$dylib" >/dev/null 2>&1 \
                  || echo "warning: ad-hoc re-sign of $dylib failed" >&2
          done
          codesign --force --sign - --entitlements "$ENTITLEMENTS" "$DEST" >/dev/null 2>&1 \
              || echo "warning: ad-hoc re-sign of $DEST failed" >&2
  HunchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/UITests
    dependencies:
      - target: Hunch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.nxhx.Hunch.uitests
        TEST_TARGET_NAME: Hunch
        GENERATE_INFOPLIST_FILE: YES
  HunchUnitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: App/Tests/HunchUnitTests
    dependencies:
      - target: Hunch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.nxhx.Hunch.unittests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Hunch.app/Contents/MacOS/Hunch
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Hunch:
    build:
      targets:
        Hunch: all
        HunchUnitTests: [test]
    test:
      targets:
        - HunchUnitTests
  HunchUITests:
    build:
      targets:
        Hunch: all
        HunchUITests: [test]
    test:
      targets:
        - HunchUITests

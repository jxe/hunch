# Periphery config for the Quagmire SPM package.
#
# Run from this directory: `periphery scan`
#
# - `retain_public: true` because Quagmire IS a library — its public surface
#   is consumed by the Hunch app target (not visible to this scan).
#   Without this, every public method on `EditorView`, `EditorState`,
#   `Document`, `EditorHost`, etc. would surface as redundant.
# - SwiftUI Previews flag stays on for the same reason as the app config.
# - Periphery still flags BlockRow's `EqualitySnapshot` struct (~21
#   "assigned but never used" warnings) because the synthesized `==`
#   read isn't traced. Not suppressing — better to scroll past noise
#   than to permanently hide that file.

retain_public: true
retain_swift_ui_previews: true
relative_results: true
disable_update_check: true
